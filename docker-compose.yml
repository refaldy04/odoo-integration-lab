services:
  db:
    image: postgres:15-alpine
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo123
    volumes:
      - db-data:/var/lib/postgresql/data
    expose: # ini optional
      - "5432"

  odoo:
    image: odoo:17
    container_name: odoo-app
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo123
    volumes:
      - odoo-data:/var/lib/odoo
    # biar db beneran siap dulu baru odoo jalan

volumes:
  db-data:
  odoo-data: